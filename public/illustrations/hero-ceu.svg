<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F3FF" stop-opacity="0"/>
      <stop offset=".38" stop-color="#E9E4FF" stop-opacity=".55"/>
      <stop offset=".62" stop-color="#B9C8FF"/>
      <stop offset="1" stop-color="#7FA6FF"/>
    </linearGradient>
    <linearGradient id="skyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F86F2" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#C9B8FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFD9E6" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".42" stop-color="#fff"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="artMask"><rect width="1400" height="360" fill="url(#maskGrad)"/></mask>
    <linearGradient id="maskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".34" stop-color="#000"/>
      <stop offset=".58" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="maskV" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".6" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="bottomFade"><rect width="1400" height="360" fill="url(#maskV)"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset=".4" stop-color="#FFE1A8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFE1A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A57A63"/>
      <stop offset=".5" stop-color="#7A5248"/>
      <stop offset="1" stop-color="#4E3446" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE07A"/>
      <stop offset="1" stop-color="#3FA56A"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#D9CDE8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C6CFF"/>
      <stop offset="1" stop-color="#4B2DB8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6FBFF"/>
      <stop offset="1" stop-color="#8FD8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pl1" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFB27A"/><stop offset="1" stop-color="#E0603A"/></radialGradient>
    <radialGradient id="pl2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#C9B6FF"/><stop offset="1" stop-color="#6A47D6"/></radialGradient>
  </defs>

  <g mask="url(#artMask)">
    <rect width="1400" height="360" fill="url(#sky)"/>
    <rect width="1400" height="360" fill="url(#skyV)"/>
    <circle cx="1180" cy="70" r="120" fill="url(#sun)"/>

    <!-- estrelas e brilhos -->
    <g fill="#fff">
      <circle cx="920" cy="40" r="2" opacity=".9"/><circle cx="1010" cy="96" r="1.6" opacity=".8"/><circle cx="1300" cy="40" r="2" opacity=".8"/>
      <circle cx="1350" cy="130" r="1.5" opacity=".7"/><circle cx="860" cy="120" r="1.4" opacity=".7"/>
      <path d="M1080 34l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      <path d="M1360 210l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z" opacity=".9"/>
    </g>

    <!-- planetas distantes -->
    <circle cx="960" cy="64" r="16" fill="url(#pl2)" opacity=".85"/>
    <g transform="rotate(-16 1330 84)"><ellipse cx="1330" cy="84" rx="30" ry="7" fill="none" stroke="#FFD27A" stroke-width="3" opacity=".9"/><circle cx="1330" cy="84" r="14" fill="url(#pl1)"/><path d="M1300 84a30 7 0 0 0 60 0" fill="none" stroke="#FFD27A" stroke-width="3"/></g>

    <!-- nuvens de fundo -->
    <g fill="#fff" opacity=".7" filter="url(#softer)">
      <ellipse cx="900" cy="250" rx="140" ry="48"/>
      <ellipse cx="1340" cy="190" rx="120" ry="60"/>
    </g>

    <!-- ilha flutuante com castelo -->
    <g transform="translate(1100 46) scale(.74)">
      <!-- cachoeira -->
      <path d="M118 120 q6 60 -2 150 h26 q-6 -90 0 -150z" fill="url(#water)" opacity=".95"/>
      <path d="M126 122 q4 50 -1 130" stroke="#fff" stroke-width="3" opacity=".8" fill="none"/>
      <!-- rocha -->
      <path d="M-10 108 q100 -18 230 0 q-14 56 -70 92 q-40 22 -50 66 q-14 -40 -46 -58 q-52 -28 -64 -100z" fill="url(#rock)"/>
      <path d="M-14 104 q114 -24 238 0 q-6 14 -20 16 q-100 -10 -196 2 q-18 -4 -22 -18z" fill="url(#grass)"/>
      <!-- árvores -->
      <circle cx="8" cy="96" r="14" fill="#4FBF77"/><circle cx="22" cy="90" r="11" fill="#6BD48A"/>
      <circle cx="198" cy="94" r="13" fill="#4FBF77"/><circle cx="186" cy="88" r="9" fill="#6BD48A"/>
      <!-- castelo -->
      <rect x="54" y="40" width="96" height="62" rx="4" fill="url(#wall)"/>
      <rect x="40" y="18" width="26" height="84" rx="4" fill="url(#wall)"/>
      <rect x="138" y="22" width="26" height="80" rx="4" fill="url(#wall)"/>
      <rect x="88" y="0" width="30" height="102" rx="4" fill="url(#wall)"/>
      <path d="M36 20 l17 -34 l17 34z" fill="url(#roof)"/>
      <path d="M134 24 l17 -32 l17 32z" fill="url(#roof)"/>
      <path d="M84 2 l19 -42 l19 42z" fill="url(#roof)"/>
      <path d="M103 -40 v-14" stroke="#4B2DB8" stroke-width="2"/><path d="M103 -54 l14 5 l-14 5z" fill="#00A99D"/>
      <rect x="96" y="70" width="14" height="32" rx="7" fill="#6A47D6"/>
      <g fill="#7FA6FF"><rect x="48" y="40" width="8" height="12" rx="4"/><rect x="146" y="44" width="8" height="12" rx="4"/><rect x="99" y="22" width="8" height="12" rx="4"/><rect x="70" y="60" width="8" height="10" rx="4"/><rect x="126" y="60" width="8" height="10" rx="4"/></g>
    </g>

    <!-- nuvens da frente -->
    <g>
      <g fill="#E9E2FF">
        <ellipse cx="1010" cy="318" rx="150" ry="52"/>
        <ellipse cx="1300" cy="310" rx="150" ry="60"/>
      </g>
      <g fill="#fff">
        <ellipse cx="1000" cy="336" rx="150" ry="56"/>
        <ellipse cx="1140" cy="352" rx="170" ry="60"/>
        <ellipse cx="1300" cy="320" rx="150" ry="64"/>
        <ellipse cx="860" cy="350" rx="120" ry="40"/>
        <ellipse cx="1220" cy="300" rx="70" ry="40"/>
        <ellipse cx="960" cy="296" rx="60" ry="34"/>
      </g>
      <g fill="#E4DCFF" opacity=".75">
        <ellipse cx="1060" cy="352" rx="120" ry="24"/>
        <ellipse cx="1290" cy="352" rx="120" ry="22"/>
      </g>
    </g>
  </g>
</svg>
